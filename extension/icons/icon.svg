  </defs>

  <!-- antenna -->
  <rect x="45" y="2" width="7" height="15" rx="3.5" fill="url(#bubble)"/>
  <rect x="76" y="2" width="7" height="15" rx="3.5" fill="url(#bubble)"/>
  <circle cx="48.5" cy="3" r="4.5" fill="url(#bubble)"/>
