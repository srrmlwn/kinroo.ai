  <!-- eyes -->
  <circle cx="49" cy="59" r="7.5" fill="#0B1220"/>
  <circle cx="79" cy="59" r="7.5" fill="#0B1220"/>
  <circle cx="51.5" cy="56.5" r="2.2" fill="#ffffff"/>
  <circle cx="81.5" cy="56.5" r="2.2" fill="#ffffff"/>

